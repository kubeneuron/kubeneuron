# Cloud-only policy pack. Requires the recovery-mode CRD schema.
# Global installation DryRun remains the default. AddFirst is never silently
# downgraded to RemoveFirst; until provision-before-delete is implemented the
# replacement path reports unavailable. Qualify each fault/pool before arming.
---
apiVersion: kubeneuron.io/v1alpha1
kind: GPURemediationPolicy
metadata:
  name: kubeneuron-cloud-xid-app
  labels: {kubeneuron.io/policy-pack: cloud, kubeneuron.io/policy-pack-version: "1"}
spec:
  kubeNeuronRef: kubeneuron
  priority: 900
  mode: Approval
  match: {class: xid-app}
  playbookRef: kubeneuron-cloud-observe
  replacement: {strategy: AddFirst}
  recycle: {enabled: false}
---
