---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: gpuautonomyplans.kubeneuron.io
spec:
  group: kubeneuron.io
  names:
    kind: GPUAutonomyPlan
    listKind: GPUAutonomyPlanList
    plural: gpuautonomyplans
    shortNames:
    - gautonomy
    singular: gpuautonomyplan
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.state
      name: State
      type: string
    - jsonPath: .spec.expiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          GPUAutonomyPlan declares a time-bounded, independently approved automatic
          action envelope. Creating it alone never enables cluster-wide automation.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GPUAutonomyPlanSpec is a deliberately narrow autonomous effect envelope.
              It does not replace the controller's global execution mode; every effect is
              still re-evaluated against the profile, evidence, ownership and pause gates.
            properties:
              allowedActions:
                description: |-
                  v0.4.0 intentionally permits exactly one action class per plan. A
                  second action needs a separate approval and canary envelope.
                items:
                  description: |-
                    AcceleratorRuntimeAction is a semantic remediation capability. It names a
                    controller-level action, never an arbitrary command or an enablement switch.
                  enum:
                  - evacuate-workloads
                  - quarantine-node
                  - reset-device
                  - restart-runtime
                  - reboot-node
                  - collect-diagnostics
                  - verify-health
                  - replace-node
                  type: string
                maxItems: 1
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              approvals:
                description: |-
                  GPUAutonomyApprovalsSpec requires multi-party approval before a plan can
                  leave simulation. The API/controller bind every approval to the immutable
                  configuration digest in status; this spec cannot be a global switch.
                properties:
                  distinctSubjects:
                    type: boolean
                  requiredRoles:
                    items:
                      type: string
                    maxItems: 8
                    minItems: 2
                    type: array
                    x-kubernetes-list-type: set
                required:
                - distinctSubjects
                - requiredRoles
                type: object
                x-kubernetes-validations:
                - message: GPUAutonomyPlan requires distinctSubjects=true
                  rule: self.distinctSubjects == true
              evidence:
                description: |-
                  GPUAutonomyEvidenceSpec names the bounded evidence contract an autonomy
                  plan must re-check immediately before an effect. Sources are names, not
                  arbitrary URLs or credentials; raw diagnostics remain outside the CRD.
                properties:
                  maxAge:
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  requiredSources:
                    items:
                      enum:
                      - agent
                      - controller
                      - dcgm
                      type: string
                    maxItems: 8
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                required:
                - maxAge
                - requiredSources
                type: object
              expiresAt:
                format: date-time
                type: string
              guardrails:
                description: |-
                  GPUAutonomyGuardrailsSpec bounds one plan's blast radius. These are upper
                  bounds, never permissions: the controller's global pause, runtime profile,
                  agent arming and existing safety gates remain mandatory.
                properties:
                  errorBudget:
                    format: int32
                    minimum: 0
                    type: integer
                  maintenanceWindows:
                    items:
                      minLength: 1
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                  maxActionsPerHour:
                    format: int32
                    minimum: 1
                    type: integer
                  maxConcurrentNodes:
                    format: int32
                    minimum: 1
                    type: integer
                  noActiveIncident:
                    type: boolean
                required:
                - errorBudget
                - maxActionsPerHour
                - maxConcurrentNodes
                - noActiveIncident
                type: object
              policyRef:
                description: |-
                  PolicyRef and ProfileRef identify immutable reviewed revisions (usually
                  name@digest or name#generation), not a mutable default policy.
                minLength: 1
                type: string
              profileRef:
                minLength: 1
                type: string
              rollout:
                description: GPUAutonomyRolloutSpec defines the bounded canary and
                  bake envelope.
                properties:
                  bakeDuration:
                    pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                    type: string
                  canaryNodes:
                    format: int32
                    minimum: 1
                    type: integer
                  expansionSteps:
                    description: |-
                      ExpansionSteps are absolute bounded target counts. A plan remains
                      one-action-class and one selector; an expansion cannot introduce a
                      different device or workload scope.
                    items:
                      format: int32
                      minimum: 1
                      type: integer
                    maxItems: 16
                    type: array
                required:
                - bakeDuration
                - canaryNodes
                type: object
              selector:
                description: |-
                  A label selector is a label query over a set of resources. The result of matchLabels and
                  matchExpressions are ANDed. An empty label selector matches all objects. A null
                  label selector matches no objects.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
            required:
            - allowedActions
            - approvals
            - evidence
            - expiresAt
            - guardrails
            - policyRef
            - profileRef
            - rollout
            - selector
            type: object
            x-kubernetes-validations:
            - message: selector.matchLabels is required and cannot select every node
              rule: has(self.selector.matchLabels) && self.selector.matchLabels.size()
                > 0
            - message: selector supports matchLabels only
              rule: '!has(self.selector.matchExpressions) || self.selector.matchExpressions.size()
                == 0'
            - message: policyRef must name an immutable revision
              rule: self.policyRef.contains('@sha256:') || self.policyRef.contains('#')
            - message: profileRef must name an immutable revision
              rule: self.profileRef.contains('@sha256:') || self.profileRef.contains('#')
            - message: guardrails.noActiveIncident must be true
              rule: self.guardrails.noActiveIncident == true
            - message: canaryNodes cannot exceed maxConcurrentNodes
              rule: self.rollout.canaryNodes <= self.guardrails.maxConcurrentNodes
          status:
            description: |-
              GPUAutonomyPlanStatus projects the durable autonomy lifecycle for kubectl
              and GitOps readers. It is not an authority to execute: the controller's
              operational store remains the append-only audit and effect authority.
            properties:
              approvals:
                items:
                  description: |-
                    GPUAutonomyApprovalStatus is a non-secret audit summary. The approving
                    subject and role are retained, but no bearer token, raw diagnostic payload,
                    or authorization assertion is copied into the CRD.
                  properties:
                    actor:
                      type: string
                    approvedAt:
                      format: date-time
                      type: string
                    configDigest:
                      type: string
                    role:
                      type: string
                  required:
                  - actor
                  - approvedAt
                  - configDigest
                  - role
                  type: object
                type: array
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              configDigest:
                type: string
              lastTransitionTime:
                format: date-time
                type: string
              observedGeneration:
                format: int64
                type: integer
              rolloutID:
                type: string
              simulationID:
                type: string
              state:
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
