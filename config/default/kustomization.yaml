apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace only what does not name one: the operator's root-events Role and
# RoleBinding live in default, where the KubeNeuron object's events and the
# node events are, and a plain namespace: field would move them.
transformers:
  - namespace_transformer.yaml

resources:
  - namespace.yaml
  - ../crd
  - ../rbac
  - operator_deployment.yaml
