apiVersion: kubeneuron.io/v1alpha1
kind: KubeNeuron
metadata:
  name: kubeneuron
spec:
  namespace: kube-neuron
  controller:
    image: ghcr.io/kubeneuron/kubeneuron/controller:v0.1.1
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 512Mi
  agent:
    image: ghcr.io/kubeneuron/kubeneuron/agent:v0.1.1
    nodeSelector:
      nvidia.com/gpu.present: "true"
    tolerations:
      - operator: Exists
  safety:
    executionMode: DryRun
    maxConcurrentRemediations: 2
    maxConcurrentReboots: 1
    verifyQuietWindow: 10m
    flapCount: 3
    flapWindow: 24h
  approvals:
    ttl: 12h
  # Alertmanager ingress is always bearer-authenticated. The operator API
  # token is also required when starting Paused so an authenticated operator
  # can resume the gate. Both Secret keys default to "token".
  notifications:
    operatorAPIToken:
      name: kubeneuron-operator-api-token
    webhookToken:
      name: kubeneuron-alertmanager-webhook-token
    # slack:
    #   name: kubeneuron-slack
  workflowStore:
    # SQLite is intended only for a single-controller dry-run installation.
    type: SQLite
    sqlite:
      size: 5Gi
      # storageClassName: fast-retain
  # These four Secrets are installation-local. No service mesh or external
  # certificate operator is required; hack/kind-integration.sh generates
  # ephemeral fixtures with the same key and SAN contract for its smoke test.
  tls:
    serverSecretRef:
      name: kubeneuron-controller-tls
    clientCASecretRef:
      name: kubeneuron-agent-client-ca
    clientSecretRef:
      name: kubeneuron-agent-tls
    serverCASecretRef:
      name: kubeneuron-controller-server-ca
  # Node recycle/replace remediation against the cloud behind the nodes.
  # Provider-scoped: the provider selects which per-provider block applies.
  # Leave the whole block out to disable it (RecycleNode/ReplaceNode then fail
  # closed). AWS declares both primitives; a provider that lacks one is rejected
  # at compile time for any playbook that would use it.
  # cloud:
  #   provider: aws
  #   aws:
  #     region: us-east-1
  #     iamRoleARN: arn:aws:iam::123456789012:role/kubeneuron-recycle
  observability:
    victoriaMetrics:
      # Installed separately by deploy/kubernetes/dependencies; KubeNeuron
      # declares but never owns this upstream-managed service.
      mode: External
      endpoint: http://vmsingle-kubeneuron.kubeneuron-monitoring.svc:8428
    alertmanager:
      mode: External
      endpoint: http://vmalertmanager-kubeneuron.kubeneuron-monitoring.svc:9093
