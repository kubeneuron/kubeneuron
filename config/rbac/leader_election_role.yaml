apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubeneuron-operator-leader-election
  namespace: kube-neuron
  labels:
    app.kubernetes.io/name: kube-neuron
    app.kubernetes.io/component: operator
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - update
