apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubeneuron-operator
  labels:
    app.kubernetes.io/name: kube-neuron
    app.kubernetes.io/component: operator
rules:
  - apiGroups:
      - kubeneuron.io
    resources:
      - kubeneurons
      - gpuremediationpolicies
      - gpuplaybooks
      - gpusignalmappings
      - gpumaintenancewindows
      - gpunodeconfigs
      - acceleratorruntimeprofiles
      - gpuautonomyplans
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kubeneuron.io
    resources:
      - kubeneurons/status
      - gpuremediationpolicies/status
      - gpuplaybooks/status
      - acceleratorruntimeprofiles/status
      - gpusignalmappings/status
      - gpuautonomyplans/status
    verbs:
      - get
      - patch
      - update
  - apiGroups:
      - kubeneuron.io
    resources:
      - kubeneurons/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - configmaps
      - serviceaccounts
      - services
    verbs:
      - create
      - get
      - list
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - persistentvolumeclaims
    verbs:
      - create
      - get
      - list
      - update
      - watch
  # The operator issues and renews the installation's own mTLS material.
  # Deliberately no delete: nothing about certificate rotation requires
  # removing a Secret, and not holding the verb means a bug here cannot destroy
  # credentials an operator supplied.
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - create
      - get
      - list
      - update
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
    verbs:
      - create
      - get
      - list
      - update
      - watch
  - apiGroups:
      - policy
    resources:
      - poddisruptionbudgets
    verbs:
      - create
      - get
      - list
      - update
      - watch
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
      - clusterrolebindings
    verbs:
      - create
      - get
      - list
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - get
      - list
      - watch
      - patch
  # `patch` on pods exists so the operator can delegate it: the managed
  # controller ClusterRole carries it only when
  # spec.safety.checkpointCoordination is enabled, and RBAC escalation
  # prevention means the operator must hold a verb before it can grant one.
  # This static role cannot be conditional, so it holds the verb whether or
  # not any installation currently asks for it. The operator itself never
  # patches a Pod; the controller's use is confined in code to the
  # kubeneuron.io/checkpoint-* request annotations on allowlisted namespaces.
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
      - patch
  - apiGroups:
      - ""
    resources:
      - pods/eviction
    verbs:
      - create
  # Read-only Dynamic Resource Allocation visibility, held so the operator can
  # delegate it: the managed controller ClusterRole carries this rule only
  # while spec.safety.topologyClassifier.dra.enabled is true, and RBAC
  # escalation prevention means the operator must hold a rule before it can
  # grant one. The operator itself never reads these objects. No write verb
  # on resource.k8s.io exists anywhere in KubeNeuron, and this is the ONLY
  # resource in the group either role can read: ResourceClaim use is seen
  # through the Pod specs the core pods rule already covers.
  - apiGroups:
      - resource.k8s.io
    resources:
      - resourceslices
    verbs:
      - get
      - list
      - watch
  # Read-only workload-context visibility for the impact preview, held so the
  # operator can delegate it: the managed controller ClusterRole carries each
  # of these rules only while spec.safety.impactPreview is enabled AND the
  # matching workloadContext resolver is selected. The operator itself never
  # reads these objects. No write verb on batch, kueue.x-k8s.io or ray.io
  # exists anywhere in KubeNeuron: the resolvers only say whose Pod a Pod is.
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - kueue.x-k8s.io
    resources:
      - workloads
      - localqueues
      - clusterqueues
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ray.io
    resources:
      - rayclusters
      - rayjobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  # Granted onward to the managed controller for operator-API authorization
  # (SubjectAccessReview of authenticated callers against the KubeNeuron CR).
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
  # Required to delegate leader-election Lease access to the managed
  # controller role (RBAC escalation prevention: you cannot grant what you
  # do not hold).
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - update
