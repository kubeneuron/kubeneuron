# generated by `make generate-gpucatalog` from internal/gpucatalog; do not edit
# Each field has a source side (dcgm_field, aliases, series, exporter_exposed, source, raw) and a
# canonical side (canonical.series/kind/unit/factor/labels). See canonical_contract: the canonical
# side is the contract the shipped recording rules implement: the canonical series is recorded
# from the source series when the source exists and is absent otherwise; recording it validates nothing.
# source is dcgm-exporter only for fields the shipped exporter profile lists (exporter_exposed: true);
# source dcgm-field marks a DCGM field that is merely cataloged and that no exporter is asserted to emit.
# derived lists the signals the gpu-derived-* recording groups compute from canonical series, or from derived series declared earlier (formula = the rule expr);
# no_data says what an absent sample means, and an entry with deferred set is intentionally not recorded.
version: v1.7.0
canonical_contract: 'A canonical mapping is the contract the shipped recording rules implement: it states the kubeneuron_gpu_* series, unit and fixed labels the rules derive from the source field. Since v1.6.0 the canonical recording rules (configs/vmalert/gpu-recording-rules.yaml, mirrored in the deployed VMRule) record every mapped series from its source series, so a canonical series exists exactly when its source series is scraped; an absent source yields no canonical sample, never a synthesised zero. A recorded series is not a validated one: the rules add no hardware evidence, and every support cell stands as the catalog states it. The source side is likewise a description: a DCGM field is emitted by the pinned dcgm-exporter only when the shipped profile lists its series (profiled = yes, source = dcgm-exporter); every other DCGM field has source = dcgm-field, which means it is cataloged by id from NVIDIA documentation and no exporter is asserted to emit it.'
