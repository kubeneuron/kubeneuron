reserved_canonical:
  - series: kubeneuron_gpu_xid_errors_total
    reason: 'needs an event counter source: DCGM_EXP_XID_ERRORS_TOTAL once confirmed to label each XID code, or a kernel-log (kmsg) watcher. DCGM_FI_DEV_XID_ERRORS (230) keeps only the last code for the hostengine''s lifetime, so a repeat is invisible and a rate over it would count nothing or count one event forever. The gauge therefore maps to no canonical series; this counter stays reserved until a counter source is cataloged.'
  - series: kubeneuron_gpu_recovery_action
    reason: 'DCGM_FI_DEV_GPU_RECOVERY_ACTION (1523) is cataloged only: not enabled in any profile, not shown to be exposed by the pinned dcgm-exporter, unvalidated on every hardware and attached to no action. A canonical series for it is assigned when the field is first enabled, together with the enumeration of its values.'
xid_buckets:
  - name: application
    codes:
      - 13
      - 31
      - 43
      - 46
    help: Engine, page-fault and channel errors that are almost always a workload bug.
  - name: ecc
    codes:
      - 48
      - 63
      - 64
      - 92
      - 94
      - 95
    help: ECC and row-remap events, correctable and uncorrectable alike.
  - name: nvlink
    codes:
      - 74
    help: NVLink fabric errors.
  - name: bus
    codes:
      - 79
    help: PCIe bus loss.
  - name: gsp
    codes:
      - 119
      - 120
    help: GPU System Processor RPC timeouts and faults.
  - name: other
    codes: []
    help: Any XID not listed above. Counted, never classified.
deferred:
  - area: 'Tier T2: DCGM effective-work / profiling fields (DCGM_FI_PROF_*)'
    reason: require DCGM profiling support and exclusive access to hardware counters; not part of the MVP baseline. The only exception is the baseline PCIe byte-rate fields DCGM_FI_PROF_PCIE_TX_BYTES (1009) and DCGM_FI_PROF_PCIE_RX_BYTES (1010), which are link-traffic telemetry and sit in T0.
  - area: 'Tier T3: Triton / inference-serving metrics (nv_inference_*)'
    reason: come from a different exporter with per-model cardinality; they need their own catalog once a serving stack exists in a reference environment. The kubeneuron_serving_* names in Appendix A of the brief are not cataloged here.
  - area: vGPU fields (DCGM_FI_DEV_VGPU_*)
    reason: no vGPU host in any validated environment; semantics differ per hypervisor.
  - area: MIG-instance scoping of listed fields
    reason: the only hardware this project has run on (Tesla T4) is MIG-incapable; instance-level labels stay unvalidated until an A100/H100 run exists.
  - area: Recovery-action automation keyed to catalog entries
    reason: 'the catalog describes signals only. Alert rules, detector thresholds, playbooks and controller behaviour are unchanged by it; wiring a field or XID bucket to an action is a separate, reviewed change. DCGM_FI_DEV_GPU_RECOVERY_ACTION (1523) is cataloged for its id and semantics only: it is not enabled in any profile, not shown to be exposed by the pinned dcgm-exporter, attached to no action, and mapped to no canonical series (kubeneuron_gpu_recovery_action is reserved).'
  - area: XID event counter (kubeneuron_gpu_xid_errors_total)
    reason: the brief derives XID rate from a counter per code. The catalog's only XID field, DCGM_FI_DEV_XID_ERRORS (230), is a sticky last-value gauge and is deliberately not mapped to that counter; the name is reserved until DCGM_EXP_XID_ERRORS_TOTAL or a kernel-log watcher is cataloged as the source.
  - area: Alerts, consumers of the experimental fail-slow score, an aggregate health or error score and hardware evidence for the canonical and derived series
    reason: 'the shipped recording rules (configs/vmalert/gpu-recording-rules.yaml and the deployed VMRule) normalise (gpu-canonical-* groups: each kubeneuron_gpu_* series is its source series times the catalog factor with the fixed labels, produced when the source exists and absent otherwise) and derive (gpu-derived-* groups: headroom, ratios, rates and hard-fault components computed from canonical series or from derived series declared earlier in the list, listed under derived). The only alerts reading them are the shadow-only ShadowGpu* rules (configs/vmalert/gpu-shadow-rules.yaml), which route to humans and trigger no remediation; the experimental fail-slow score (kubeneuron_gpu_fail_slow_score_ratio) is recorded from the derived ratios and read only by the Fail-slow Radar board and the shadow-only ShadowGpuFailSlow alert; no aggregate health or error score is defined because one number would hide which component moved, and recording a series validates nothing: every support cell stands as declared, validated (v0.6.0-era Tesla T4 evidence) or unknown exactly as before. Appendix A rows whose DCGM fields are not cataloged (NVLink byte rates 1011, 1012, which are DCGM_FI_PROF_* and tier T2; the exporter-computed DCGM_EXP_GPU_HEALTH_STATUS, which has no DCGM field id) have no mapping and no rule until their fields are added.'
  - area: v0.7 hardware validation
    reason: no v0.7 run has been recorded. Every validated cell cites v0.6.0-era evidence from the Tesla T4 stand; every other cell is declared from NVIDIA documentation or unknown.
derived:
  - series: kubeneuron_gpu_thermal_headroom_celsius
    kind: gauge
    unit: celsius
    formula: kubeneuron_gpu_thermal_margin_celsius or (label_del(kubeneuron_gpu_temperature_limit_celsius{limit="slowdown"}, "limit") - kubeneuron_gpu_temperature_celsius)
    inputs:
      - kubeneuron_gpu_thermal_margin_celsius
      - kubeneuron_gpu_temperature_limit_celsius
      - kubeneuron_gpu_temperature_celsius
    no_data: absent when the GPU reports neither a thermal margin (153) nor both a slowdown threshold (158) and a temperature (150); the fallback is used only for devices with no margin sample, never summed with it.
    help: 'Degrees of headroom before thermal slowdown: the reported thermal margin, else slowdown threshold minus GPU temperature.'
    group: gpu-derived-thermal
  - series: kubeneuron_gpu_memory_thermal_headroom_celsius
    kind: gauge
    unit: celsius
    formula: kubeneuron_gpu_memory_temperature_limit_celsius - kubeneuron_gpu_memory_temperature_celsius
    inputs:
      - kubeneuron_gpu_memory_temperature_limit_celsius
      - kubeneuron_gpu_memory_temperature_celsius
    no_data: absent when the memory temperature (140) or its maximum operating temperature (151) is not reported; whether the Tesla T4 reports either is not established.
    help: Degrees of headroom before the memory's maximum operating temperature.
    group: gpu-derived-thermal
  - series: kubeneuron_gpu_power_ratio
    kind: gauge
    unit: ratio
    formula: kubeneuron_gpu_power_watts / (kubeneuron_gpu_power_limit_watts > 0)
    inputs:
      - kubeneuron_gpu_power_watts
      - kubeneuron_gpu_power_limit_watts
    no_data: absent when power draw (155) or the enforced limit (164) is not reported, or the limit is 0 (no division by zero is recorded).
    help: Power draw as a fraction of the enforced power limit; above 1 means the limit is being exceeded at the sample instant.
    group: gpu-derived-power
  - series: kubeneuron_gpu_throttle_share_ratio
    kind: gauge
    unit: ratio
    carried:
      - reason
    formula: rate(kubeneuron_gpu_throttle_seconds_total[5m])
    inputs:
      - kubeneuron_gpu_throttle_seconds_total
    no_data: absent per reason when the violation-time counter for that reason is not reported or has fewer than two samples in the window; a reason the hardware never throttles on reads 0, not absent.
    help: Fraction of wall time spent throttled, per reason (power, thermal, sync_boost, board_limit, reliability), over the last 5m.
    group: gpu-derived-power
  - series: kubeneuron_gpu_clock_ratio
    kind: gauge
    unit: ratio
    carried:
      - domain
    formula: kubeneuron_gpu_clock_hertz / (kubeneuron_gpu_clock_max_hertz > 0)
    inputs:
      - kubeneuron_gpu_clock_hertz
      - kubeneuron_gpu_clock_max_hertz
    no_data: absent per domain (sm, memory) when the current or the maximum clock is not reported, or the maximum is 0.
    help: Current clock as a fraction of the maximum clock, per domain; the sm domain is the SM clock ratio.
    group: gpu-derived-clocks
  - series: kubeneuron_gpu_memory_used_ratio
    kind: gauge
    unit: ratio
    formula: kubeneuron_gpu_memory_used_bytes / (kubeneuron_gpu_memory_total_bytes > 0)
    inputs:
      - kubeneuron_gpu_memory_used_bytes
      - kubeneuron_gpu_memory_total_bytes
    no_data: absent when framebuffer used (252) or total (250) is not reported, or total is 0.
    help: Framebuffer memory in use as a fraction of total framebuffer memory.
    group: gpu-derived-memory
  - series: kubeneuron_gpu_ecc_corrected_errors_per_second
    kind: gauge
    unit: count
    carried:
      - scope
    formula: label_del(rate(kubeneuron_gpu_ecc_errors_total{bits="single"}[5m]), "bits")
    inputs:
      - kubeneuron_gpu_ecc_errors_total
    no_data: absent per scope when the single-bit ECC counter for that scope (310 volatile, 312 aggregate) is not reported (ECC disabled or unsupported) or has fewer than two samples in the window; scope stays on the result so the two never collide.
    help: Corrected (single-bit) ECC errors per second over the last 5m, per scope (volatile, aggregate); a soft-error rate, not a fault.
    group: gpu-derived-memory
  - series: kubeneuron_gpu_ecc_uncorrectable_errors_per_second
    kind: gauge
    unit: count
    carried:
      - scope
    formula: label_del(rate(kubeneuron_gpu_ecc_errors_total{bits="double"}[5m]), "bits")
    inputs:
      - kubeneuron_gpu_ecc_errors_total
    no_data: absent per scope when the double-bit ECC counter for that scope (311 volatile, 313 aggregate) is not reported or has fewer than two samples in the window; scope stays on the result so the two never collide.
    help: Uncorrectable (double-bit) ECC errors per second over the last 5m, per scope (volatile, aggregate).
    group: gpu-derived-memory
  - series: kubeneuron_gpu_retired_pages_per_second
    kind: gauge
    unit: count
    carried:
      - cause
    formula: rate(kubeneuron_gpu_retired_pages_total[5m])
    inputs:
      - kubeneuron_gpu_retired_pages_total
    no_data: absent per cause (single_bit, double_bit) when that retired-page counter (390, 391) is not reported (page retirement is pre-Ampere; Ampere+ remaps rows instead) or has fewer than two samples in the window.
    help: Pages retired per second over the last 5m, per cause (single_bit, double_bit); pre-Ampere page retirement only.
    group: gpu-derived-memory
  - series: kubeneuron_gpu_memory_hard_fault_active
    kind: gauge
    unit: boolean
    labels:
      - name: component
        value: uncorrectable_ecc_volatile
    formula: label_del(increase(kubeneuron_gpu_ecc_errors_total{bits="double",scope="volatile"}[1h]), "bits", "scope") > bool 0
    inputs:
      - kubeneuron_gpu_ecc_errors_total
    no_data: absent when the volatile double-bit ECC counter (311) is not reported (ECC disabled or unsupported) or has fewer than two samples in the 1h window; 0 when it is reported and did not grow in the last hour. Reads 311 only; the aggregate counter (313) is its own component, and the two are never combined.
    help: 1 while the volatile (since last reset) uncorrectable ECC counter grew in the last hour. One component of hard memory fault; components are never summed.
    group: gpu-derived-memory
  - series: kubeneuron_gpu_memory_hard_fault_active
    kind: gauge
    unit: boolean
    labels:
      - name: component
        value: uncorrectable_ecc_aggregate
    formula: label_del(increase(kubeneuron_gpu_ecc_errors_total{bits="double",scope="aggregate"}[1h]), "bits", "scope") > bool 0
    inputs:
      - kubeneuron_gpu_ecc_errors_total
    no_data: absent when the aggregate (lifetime) double-bit ECC counter (313) is not reported (ECC disabled or unsupported) or has fewer than two samples in the 1h window; 0 when it is reported and did not grow in the last hour. Reads 313 only; the volatile counter (311) is its own component, and the two are never combined.
    help: 1 while the aggregate (lifetime, persists across resets) uncorrectable ECC counter grew in the last hour. One component of hard memory fault; components are never summed.
    group: gpu-derived-memory
  - series: kubeneuron_gpu_memory_hard_fault_active
    kind: gauge
    unit: boolean
    labels:
      - name: component
        value: uncorrectable_row_remap
    formula: label_del(increase(kubeneuron_gpu_remapped_rows_total{kind="uncorrectable"}[1h]), "kind") > bool 0
    inputs:
      - kubeneuron_gpu_remapped_rows_total
    no_data: absent when the uncorrectable remapped-rows counter (393) is not reported (row remapping is Ampere+, not-applicable on the Tesla T4); 0 when reported and unchanged in the last hour.
    help: 1 while at least one row was remapped for an uncorrectable error in the last hour.
    group: gpu-derived-memory
  - series: kubeneuron_gpu_memory_hard_fault_active
    kind: gauge
    unit: boolean
    labels:
      - name: component
        value: row_remap_failed
    formula: kubeneuron_gpu_row_remap_failed > bool 0
    inputs:
      - kubeneuron_gpu_row_remap_failed
    no_data: absent when the row-remap failure flag (395) is not reported (Ampere+ only).
    help: 1 while the GPU reports a failed row remap, which is unrecoverable without service.
    group: gpu-derived-memory
  - series: kubeneuron_gpu_memory_hard_fault_active
    kind: gauge
    unit: boolean
    labels:
      - name: component
        value: row_remap_pending
    formula: kubeneuron_gpu_row_remap_pending > bool 0
    inputs:
      - kubeneuron_gpu_row_remap_pending
    no_data: absent when the row-remap pending flag (396) is not reported (Ampere+ only); 0 when reported and no remap awaits a reset.
    help: 1 while a row remap is pending a GPU reset; the fault is recorded but not yet repaired.
    group: gpu-derived-memory
  - series: kubeneuron_gpu_memory_hard_fault_active
    kind: gauge
    unit: boolean
    labels:
      - name: component
        value: retired_page_pending
    formula: kubeneuron_gpu_retired_pages_pending > bool 0
    inputs:
      - kubeneuron_gpu_retired_pages_pending
    no_data: absent when the retired-page pending flag (392) is not reported (pre-Ampere only); 0 when reported and no retirement awaits a reset.
    help: 1 while a page retirement is pending a GPU reset (pre-Ampere).
    group: gpu-derived-memory
  - series: kubeneuron_gpu_memory_hard_fault_active
    kind: gauge
    unit: boolean
    labels:
      - name: component
        value: unrepairable
    formula: kubeneuron_gpu_memory_unrepairable > bool 0
    inputs:
      - kubeneuron_gpu_memory_unrepairable
    no_data: absent when the unrepairable-memory flag (1507) is not reported.
    help: 1 while the GPU reports unrepairable memory.
    group: gpu-derived-memory
  - series: kubeneuron_gpu_pcie_replays_per_second
    kind: gauge
    unit: count
    formula: rate(kubeneuron_gpu_pcie_replays_total[5m])
    inputs:
      - kubeneuron_gpu_pcie_replays_total
    no_data: absent when the PCIe replay counter (202) is not reported or has fewer than two samples in the window.
    help: PCIe replay events per second over the last 5m.
    group: gpu-derived-links
  - series: kubeneuron_gpu_pcie_link_width_ratio
    kind: gauge
    unit: ratio
    formula: label_del(kubeneuron_gpu_pcie_link_width{kind="current"}, "kind") / (label_del(kubeneuron_gpu_pcie_link_width{kind="max"}, "kind") > 0)
    inputs:
      - kubeneuron_gpu_pcie_link_width
    no_data: absent when the current (237) or maximum (236) link width is not reported, or the maximum is 0.
    help: Current PCIe link width as a fraction of the maximum width; below 1 means the link trained narrow.
    group: gpu-derived-links
  - series: kubeneuron_gpu_pcie_link_generation_ratio
    kind: gauge
    unit: ratio
    formula: label_del(kubeneuron_gpu_pcie_link_generation{kind="current"}, "kind") / (label_del(kubeneuron_gpu_pcie_link_generation{kind="max"}, "kind") > 0)
    inputs:
      - kubeneuron_gpu_pcie_link_generation
    no_data: absent when the current (238) or maximum (235) link generation is not reported, or the maximum is 0. The current generation drops legitimately at idle on many boards; a low ratio under load is the signal.
    help: Current PCIe link generation as a fraction of the maximum generation.
    group: gpu-derived-links
  - series: kubeneuron_gpu_nvlink_errors_per_second
    kind: gauge
    unit: count
    carried:
      - type
    formula: rate(kubeneuron_gpu_nvlink_errors_total[5m])
    inputs:
      - kubeneuron_gpu_nvlink_errors_total
    no_data: absent per type (crc_flit, crc_data, replay, recovery) when that NVLink counter is not reported (no NVLink on the Tesla T4) or has fewer than two samples in the window.
    help: NVLink errors per second over the last 5m, per error type.
    group: gpu-derived-links
  - series: kubeneuron_gpu_recovered_capacity_hours_total
    kind: counter
    unit: hours
    carried:
      - class
    formula: label_del(kubeneuron_degraded_gpu_seconds_total{outcome="resolved"}, "outcome") / 3600
    inputs:
      - kubeneuron_degraded_gpu_seconds_total
    no_data: absent until the controller has closed at least one incident as resolved for the class; a fleet with no resolved incident has no sample, not 0.
    help: GPU-hours returned to service by resolved incidents, per problem class (resolved degraded GPU-seconds / 3600).
    group: gpu-derived-capacity
  - series: kubeneuron_gpu_fail_slow_score_ratio
    kind: gauge
    unit: ratio
    formula: (1 - max by (node, gpu_uuid, gpu_model) (kubeneuron_gpu_clock_ratio{domain="sm"}) / on (gpu_model) group_left() (median by (gpu_model) (max by (node, gpu_uuid, gpu_model) (kubeneuron_gpu_clock_ratio{domain="sm"})) > 0)) >= 0.15 and on (node, gpu_uuid, gpu_model) (max by (node, gpu_uuid, gpu_model) (kubeneuron_gpu_throttle_share_ratio) >= 0.05) and on (gpu_model) (count by (gpu_model) (max by (node, gpu_uuid, gpu_model) (kubeneuron_gpu_clock_ratio{domain="sm"})) >= 3)
    inputs:
      - kubeneuron_gpu_clock_ratio
      - kubeneuron_gpu_throttle_share_ratio
    no_data: 'shadow only: read by the Fail-slow Radar board and the shadow-only ShadowGpuFailSlow alert, which route to humans and trigger no remediation; no controller path consumes it. Absent unless all three gates hold at the sample instant: score = 1 - own SM clock ratio / median SM clock ratio of the gpu_model peer group is at least 0.15 (own clock at least 15% below the peer median); the device''s maximum throttle share over 5m across reasons is at least 0.05; and the gpu_model has at least 3 distinct devices (node, gpu_uuid, gpu_model) reporting an SM clock ratio. Inputs are deduplicated to (node, gpu_uuid, gpu_model) before the median and the count, so pod, namespace and container labels do not appear on the result and cannot weight the peer group. Also absent when the peer median is 0 or either input is missing. A healthy, idle or singleton device has no sample, not 0.'
    experimental: true
    help: 'Fail-slow degradation score: how far the SM clock ratio sits below its gpu_model peer median (1 - own/peer_median), recorded only when the device is also throttled and has at least 3 peers.'
    group: gpu-derived-fail-slow
  - series: kubeneuron_gpu_present
    kind: gauge
    unit: boolean
    no_data: always absent in this version; see deferred.
    deferred: 'intentionally No data: a presence signal needs the node''s allocatable nvidia.com/gpu from kube-state-metrics, which is not an established dependency of this project. Until it is, there is no honest source for a GPU that exists but reports nothing, and no rule records this series.'
    help: 1 while the node advertises the GPU as allocatable. Not recorded.
