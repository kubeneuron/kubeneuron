# vmalert for the kind GPU observability fixture. It loads
# configs/vmalert/gpu-recording-rules.yaml and
# configs/vmalert/gpu-shadow-rules.yaml byte-for-byte (the harness puts both
# files into the `vmalert-rules` ConfigMap), writes the recorded series and
# ALERTS state back into vmsingle, and sends firing alerts to the fixture's
# Alertmanager, which runs the shipped route tree. The controller-facing
# rule files (gpu-rules.yaml, self-rules.yaml) are deliberately not loaded:
# the fixture proves that shadow alerts stay away from the controller
# route, not that controller alerts reach it. Image tag: versions.lock.yaml
# (victoriaMetricsAlert).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  labels:
    app.kubernetes.io/name: vmalert
    app.kubernetes.io/part-of: kubeneuron-gpu-observability-fixture
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.147.0
          imagePullPolicy: IfNotPresent
          args:
            - -rule=/etc/vmalert/rules/gpu-recording-rules.yaml
            - -rule=/etc/vmalert/rules/gpu-shadow-rules.yaml
            - -datasource.url=http://vmsingle:8428
            - -remoteWrite.url=http://vmsingle:8428
            - -remoteRead.url=http://vmsingle:8428
            - -notifier.url=http://alertmanager:9093
            - -evaluationInterval=30s
            - -httpListenAddr=:8880
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert/rules
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  labels:
    app.kubernetes.io/part-of: kubeneuron-gpu-observability-fixture
spec:
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
