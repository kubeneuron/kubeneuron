# Full node reboot — the escalation target when drain-and-reset fails.
# Approval required. Reboot is guarded by boot-id comparison: the controller
# re-issues it only when the node's boot ID is unchanged and the timeout has
# passed.
name: reboot
target: node
cooldown: 6h
steps:
  - name: cordon
    action: platform.cordon
  - name: drain
    action: platform.drain
    timeout: 30m
  - name: collect-bundle
    action: agent.collect_bundle
    timeout: 15m
  - name: reboot
    action: agent.reboot
    approval: required
    timeout: 20m
  - name: verify
    action: verify.node_health
    params:
      diag_level: "2"
      quiet_window: 15m
  - name: uncordon
    action: platform.uncordon
on_failure:
  escalate_to: driver-reinstall
