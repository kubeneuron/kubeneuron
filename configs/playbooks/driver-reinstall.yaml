# Driver reinstall for persistent driver/GSP failures that survive a
# reboot. The reinstall runs an operator-provided, version-pinned script on
# the node. Approval required.
name: driver-reinstall
target: node
cooldown: 24h
steps:
  - name: cordon
    action: platform.cordon
  - name: drain
    action: platform.drain
    timeout: 30m
  - name: reinstall
    action: agent.driver_reinstall
    approval: required
    timeout: 60m
    params:
      script: /etc/kube-neuron/driver-reinstall.sh
  - name: reboot
    action: agent.reboot
    timeout: 20m
  - name: verify
    action: verify.node_health
    params:
      diag_level: "3"
      quiet_window: 30m
  - name: uncordon
    action: platform.uncordon
on_failure:
  escalate_to: rma
