# Canonical GPU recording rules: v0.7 M3 (slice 1 normalization, slice 2 derived signals, slice 3 fail-slow shadow score).
#
# Every rule here derives one kubeneuron_gpu_* series from the dcgm-exporter
# series the metric catalog (config/gpu-metrics/catalog.yaml, version v1.7.0)
# names as its source. The record name, the unit factor and the fixed labels
# are taken from the catalog field's canonical side; the catalog is the only
# source of truth and a unit test keeps this file in step with it.
#
# Label contract (vmagent relabeling, M2): each source series already carries
# node, gpu_uuid, gpu_model, gpu, pci_bus_id, device, Hostname and, when
# present, node_pool, mig_profile, pod, namespace, container, cluster. Every
# expression below is a plain arithmetic transform of a single series, so all
# of those identity and source labels flow through unchanged; the `labels:`
# block adds only the fixed canonical labels the catalog assigns.
#
# No data stays absent: there is no `or vector(0)`, `default`, `absent()` or
# any other synthesis. A source field the exporter does not emit (or a GPU
# that stops reporting) yields no canonical sample at all, never a 0.
#
# The gpu-derived-* groups at the end compute headroom, ratios, rates and
# hard-fault components from the canonical series, plus one experimental
# fail-slow score that reads two of those derived ratios; their contract is
# the catalog's `derived` table. Not here: alerts and the XID counter
# (reserved; field 230 is a sticky last-value gauge and is read by no rule).
#
# Syntax is vmalert v1.147.0 (MetricsQL). Deployed mirror:
# deploy/kubernetes/dependencies/observability/rules.yaml (VMRule
# kubeneuron-gpu-recording); the groups there must stay identical to these.

groups:
  # Clock frequencies (MHz -> Hz) and the decoded clock-event bitmask.
  - name: gpu-canonical-clocks
    interval: 30s
    rules:
      # dcgm:100: megahertz -> hertz, factor 1000000.
      - record: kubeneuron_gpu_clock_hertz
        expr: DCGM_FI_DEV_SM_CLOCK * 1000000
        labels:
          domain: sm
      # dcgm:101: megahertz -> hertz, factor 1000000.
      - record: kubeneuron_gpu_clock_hertz
        expr: DCGM_FI_DEV_MEM_CLOCK * 1000000
        labels:
          domain: memory
      # dcgm:113: megahertz -> hertz, factor 1000000.
      - record: kubeneuron_gpu_clock_max_hertz
        expr: DCGM_FI_DEV_MAX_SM_CLOCK * 1000000
        labels:
          domain: sm
      # dcgm:114: megahertz -> hertz, factor 1000000.
      - record: kubeneuron_gpu_clock_max_hertz
        expr: DCGM_FI_DEV_MAX_MEM_CLOCK * 1000000
        labels:
          domain: memory
      # dcgm:112: bitmask -> kubeneuron_gpu_clock_event_active, one series per decoded reason bit
      # (hw_slowdown=8, sw_thermal=32, hw_thermal=64, hw_power_brake=128).
      # bitmap_and keeps the bit value (0 or the mask); `> bool 0` turns it into
      # 1 while the bit is set and 0 while it is clear. The series exists only
      # while the source bitmask is reported; no source sample -> no series.
      - record: kubeneuron_gpu_clock_event_active
        expr: bitmap_and(DCGM_FI_DEV_CLOCK_THROTTLE_REASONS, 8) > bool 0
        labels:
          reason: hw_slowdown
      - record: kubeneuron_gpu_clock_event_active
        expr: bitmap_and(DCGM_FI_DEV_CLOCK_THROTTLE_REASONS, 32) > bool 0
        labels:
          reason: sw_thermal
      - record: kubeneuron_gpu_clock_event_active
        expr: bitmap_and(DCGM_FI_DEV_CLOCK_THROTTLE_REASONS, 64) > bool 0
        labels:
          reason: hw_thermal
      - record: kubeneuron_gpu_clock_event_active
        expr: bitmap_and(DCGM_FI_DEV_CLOCK_THROTTLE_REASONS, 128) > bool 0
        labels:
          reason: hw_power_brake

  # Temperatures and thermal limits (already celsius; factor 1).
  - name: gpu-canonical-thermal
    interval: 30s
    rules:
      # dcgm:140: celsius, factor 1.
      - record: kubeneuron_gpu_memory_temperature_celsius
        expr: DCGM_FI_DEV_MEMORY_TEMP
      # dcgm:150: celsius, factor 1.
      - record: kubeneuron_gpu_temperature_celsius
        expr: DCGM_FI_DEV_GPU_TEMP
      # dcgm:151: celsius, factor 1.
      - record: kubeneuron_gpu_memory_temperature_limit_celsius
        expr: DCGM_FI_DEV_MEM_MAX_OP_TEMP
      # dcgm:153: celsius, factor 1.
      - record: kubeneuron_gpu_thermal_margin_celsius
        expr: DCGM_FI_DEV_GPU_TEMP_LIMIT
      # dcgm:158: celsius, factor 1.
      - record: kubeneuron_gpu_temperature_limit_celsius
        expr: DCGM_FI_DEV_SLOWDOWN_TEMP
        labels:
          limit: slowdown
      # dcgm:159: celsius, factor 1.
      - record: kubeneuron_gpu_temperature_limit_celsius
        expr: DCGM_FI_DEV_SHUTDOWN_TEMP
        labels:
          limit: shutdown

  # Power, energy (mJ -> J) and throttle violation time (ns -> s).
  - name: gpu-canonical-power
    interval: 30s
    rules:
      # dcgm:155: watts, factor 1.
      - record: kubeneuron_gpu_power_watts
        expr: DCGM_FI_DEV_POWER_USAGE
      # dcgm:164: watts, factor 1.
      - record: kubeneuron_gpu_power_limit_watts
        expr: DCGM_FI_DEV_ENFORCED_POWER_LIMIT
      # dcgm:156: millijoules -> joules, factor 0.001.
      - record: kubeneuron_gpu_energy_joules_total
        expr: DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION * 0.001
      # dcgm:240: nanoseconds -> seconds, factor 1e-9.
      - record: kubeneuron_gpu_throttle_seconds_total
        expr: DCGM_FI_DEV_POWER_VIOLATION * 1e-9
        labels:
          reason: power
      # dcgm:241: nanoseconds -> seconds, factor 1e-9.
      - record: kubeneuron_gpu_throttle_seconds_total
        expr: DCGM_FI_DEV_THERMAL_VIOLATION * 1e-9
        labels:
          reason: thermal
      # dcgm:242: nanoseconds -> seconds, factor 1e-9.
      - record: kubeneuron_gpu_throttle_seconds_total
        expr: DCGM_FI_DEV_SYNC_BOOST_VIOLATION * 1e-9
        labels:
          reason: sync_boost
      # dcgm:243: nanoseconds -> seconds, factor 1e-9.
      - record: kubeneuron_gpu_throttle_seconds_total
        expr: DCGM_FI_DEV_BOARD_LIMIT_VIOLATION * 1e-9
        labels:
          reason: board_limit
      # dcgm:245: nanoseconds -> seconds, factor 1e-9.
      - record: kubeneuron_gpu_throttle_seconds_total
        expr: DCGM_FI_DEV_RELIABILITY_VIOLATION * 1e-9
        labels:
          reason: reliability

  # Utilization (percent -> ratio).
  - name: gpu-canonical-utilization
    interval: 30s
    rules:
      # dcgm:203: percent -> ratio, factor 0.01.
      - record: kubeneuron_gpu_utilization_ratio
        expr: DCGM_FI_DEV_GPU_UTIL * 0.01
      # dcgm:204: percent -> ratio, factor 0.01.
      - record: kubeneuron_gpu_memory_copy_utilization_ratio
        expr: DCGM_FI_DEV_MEM_COPY_UTIL * 0.01

  # Framebuffer capacity (MiB -> bytes).
  - name: gpu-canonical-memory
    interval: 30s
    rules:
      # dcgm:250: mebibytes -> bytes, factor 1048576.
      - record: kubeneuron_gpu_memory_total_bytes
        expr: DCGM_FI_DEV_FB_TOTAL * 1048576
      # dcgm:251: mebibytes -> bytes, factor 1048576.
      - record: kubeneuron_gpu_memory_free_bytes
        expr: DCGM_FI_DEV_FB_FREE * 1048576
      # dcgm:252: mebibytes -> bytes, factor 1048576.
      - record: kubeneuron_gpu_memory_used_bytes
        expr: DCGM_FI_DEV_FB_USED * 1048576

  # ECC, retired pages, row remap and unrepairable-memory state.
  - name: gpu-canonical-memory-errors
    interval: 30s
    rules:
      # dcgm:310: count, factor 1.
      - record: kubeneuron_gpu_ecc_errors_total
        expr: DCGM_FI_DEV_ECC_SBE_VOL_TOTAL
        labels:
          bits: single
          scope: volatile
      # dcgm:311: count, factor 1.
      - record: kubeneuron_gpu_ecc_errors_total
        expr: DCGM_FI_DEV_ECC_DBE_VOL_TOTAL
        labels:
          bits: double
          scope: volatile
      # dcgm:312: count, factor 1.
      - record: kubeneuron_gpu_ecc_errors_total
        expr: DCGM_FI_DEV_ECC_SBE_AGG_TOTAL
        labels:
          bits: single
          scope: aggregate
      # dcgm:313: count, factor 1.
      - record: kubeneuron_gpu_ecc_errors_total
        expr: DCGM_FI_DEV_ECC_DBE_AGG_TOTAL
        labels:
          bits: double
          scope: aggregate
      # dcgm:390: count, factor 1.
      - record: kubeneuron_gpu_retired_pages_total
        expr: DCGM_FI_DEV_RETIRED_SBE
        labels:
          cause: single_bit
      # dcgm:391: count, factor 1.
      - record: kubeneuron_gpu_retired_pages_total
        expr: DCGM_FI_DEV_RETIRED_DBE
        labels:
          cause: double_bit
      # dcgm:392: boolean, factor 1.
      - record: kubeneuron_gpu_retired_pages_pending
        expr: DCGM_FI_DEV_RETIRED_PENDING
      # dcgm:393: count, factor 1.
      - record: kubeneuron_gpu_remapped_rows_total
        expr: DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS
        labels:
          kind: uncorrectable
      # dcgm:394: count, factor 1.
      - record: kubeneuron_gpu_remapped_rows_total
        expr: DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS
        labels:
          kind: correctable
      # dcgm:395: boolean, factor 1.
      - record: kubeneuron_gpu_row_remap_failed
        expr: DCGM_FI_DEV_ROW_REMAP_FAILURE
      # dcgm:396: boolean, factor 1.
      - record: kubeneuron_gpu_row_remap_pending
        expr: DCGM_FI_DEV_ROW_REMAP_PENDING
      # dcgm:1507: boolean, factor 1.
      - record: kubeneuron_gpu_memory_unrepairable
        expr: DCGM_FI_DEV_MEMORY_UNREPAIRABLE_FLAG

  # PCIe link state, replays, throughput and NVLink error counters.
  - name: gpu-canonical-pcie-nvlink
    interval: 30s
    rules:
      # dcgm:235: count, factor 1.
      - record: kubeneuron_gpu_pcie_link_generation
        expr: DCGM_FI_DEV_PCIE_MAX_LINK_GEN
        labels:
          kind: max
      # dcgm:236: count, factor 1.
      - record: kubeneuron_gpu_pcie_link_width
        expr: DCGM_FI_DEV_PCIE_MAX_LINK_WIDTH
        labels:
          kind: max
      # dcgm:237: count, factor 1.
      - record: kubeneuron_gpu_pcie_link_generation
        expr: DCGM_FI_DEV_PCIE_LINK_GEN
        labels:
          kind: current
      # dcgm:238: count, factor 1.
      - record: kubeneuron_gpu_pcie_link_width
        expr: DCGM_FI_DEV_PCIE_LINK_WIDTH
        labels:
          kind: current
      # dcgm:202: count, factor 1.
      - record: kubeneuron_gpu_pcie_replays_total
        expr: DCGM_FI_DEV_PCIE_REPLAY_COUNTER
      # dcgm:1009: bytes_per_second, factor 1.
      - record: kubeneuron_gpu_pcie_bytes_per_second
        expr: DCGM_FI_PROF_PCIE_TX_BYTES
        labels:
          direction: tx
      # dcgm:1010: bytes_per_second, factor 1.
      - record: kubeneuron_gpu_pcie_bytes_per_second
        expr: DCGM_FI_PROF_PCIE_RX_BYTES
        labels:
          direction: rx
      # dcgm:409: count, factor 1.
      - record: kubeneuron_gpu_nvlink_errors_total
        expr: DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_COUNT_TOTAL
        labels:
          type: crc_flit
      # dcgm:419: count, factor 1.
      - record: kubeneuron_gpu_nvlink_errors_total
        expr: DCGM_FI_DEV_NVLINK_CRC_DATA_ERROR_COUNT_TOTAL
        labels:
          type: crc_data
      # dcgm:429: count, factor 1.
      - record: kubeneuron_gpu_nvlink_errors_total
        expr: DCGM_FI_DEV_NVLINK_REPLAY_ERROR_COUNT_TOTAL
        labels:
          type: replay
      # dcgm:439: count, factor 1.
      - record: kubeneuron_gpu_nvlink_errors_total
        expr: DCGM_FI_DEV_NVLINK_RECOVERY_ERROR_COUNT_TOTAL
        labels:
          type: recovery

  # ---------------------------------------------------------------------
  # Derived signals (v0.7 M3, slice 2). Every expression below reads only
  # the canonical kubeneuron_gpu_* series above (or a T4 control-plane
  # series), never a dcgm-exporter series. The catalog's `derived` table is
  # the contract: formula, inputs, unit and no-data semantics are listed
  # there and in docs/reference-gpu-metrics.md. No `or vector(0)`, no
  # `default`, no `absent()`: an input a formula needs and does not have is
  # a missing result (the thermal headroom needs either the margin or both
  # fallback inputs and is missing only when neither is reported), and a
  # zero divisor is excluded by `> 0` rather than turned into Inf or NaN.
  # label_del removes a fixed catalog label that selected the input so it
  # does not leak onto the result; identity and placement labels (node,
  # gpu_uuid, cluster, node_pool, ...) flow through untouched and are never
  # grouped on. Components only: no aggregate health or error score; the one
  # score here, the experimental fail-slow peer score, is recording-only and
  # compares a device to its peers without summing components.
  # Not here: alerts, GPU presence (intentionally
  # No data: kube-state-metrics is not an established dependency).

  # Thermal headroom: reported margin (153) first, slowdown threshold (158)
  # minus GPU temperature (150) for devices with no margin sample.
  - name: gpu-derived-thermal
    interval: 30s
    rules:
      - record: kubeneuron_gpu_thermal_headroom_celsius
        expr: kubeneuron_gpu_thermal_margin_celsius or (label_del(kubeneuron_gpu_temperature_limit_celsius{limit="slowdown"}, "limit") - kubeneuron_gpu_temperature_celsius)
      - record: kubeneuron_gpu_memory_thermal_headroom_celsius
        expr: kubeneuron_gpu_memory_temperature_limit_celsius - kubeneuron_gpu_memory_temperature_celsius

  # Power draw against the enforced limit, and throttle time share by reason.
  - name: gpu-derived-power
    interval: 30s
    rules:
      - record: kubeneuron_gpu_power_ratio
        expr: kubeneuron_gpu_power_watts / (kubeneuron_gpu_power_limit_watts > 0)
      # reason flows through from the counter.
      - record: kubeneuron_gpu_throttle_share_ratio
        expr: rate(kubeneuron_gpu_throttle_seconds_total[5m])

  # Current clock against the maximum, per domain (sm, memory).
  - name: gpu-derived-clocks
    interval: 30s
    rules:
      - record: kubeneuron_gpu_clock_ratio
        expr: kubeneuron_gpu_clock_hertz / (kubeneuron_gpu_clock_max_hertz > 0)

  # Framebuffer use, ECC rates and the named hard-fault components.
  - name: gpu-derived-memory
    interval: 30s
    rules:
      - record: kubeneuron_gpu_memory_used_ratio
        expr: kubeneuron_gpu_memory_used_bytes / (kubeneuron_gpu_memory_total_bytes > 0)
      # scope (volatile, aggregate) flows through from the counter; only the
      # bits selector is collapsed, so the two scopes never collide.
      - record: kubeneuron_gpu_ecc_corrected_errors_per_second
        expr: label_del(rate(kubeneuron_gpu_ecc_errors_total{bits="single"}[5m]), "bits")
      - record: kubeneuron_gpu_ecc_uncorrectable_errors_per_second
        expr: label_del(rate(kubeneuron_gpu_ecc_errors_total{bits="double"}[5m]), "bits")
      # cause (single_bit, double_bit) flows through; pre-Ampere only.
      - record: kubeneuron_gpu_retired_pages_per_second
        expr: rate(kubeneuron_gpu_retired_pages_total[5m])
      # Uncorrectable ECC: one component per counter scope (311 volatile,
      # 313 aggregate); each reads its own counter and nothing combines them.
      - record: kubeneuron_gpu_memory_hard_fault_active
        expr: label_del(increase(kubeneuron_gpu_ecc_errors_total{bits="double",scope="volatile"}[1h]), "bits", "scope") > bool 0
        labels:
          component: uncorrectable_ecc_volatile
      - record: kubeneuron_gpu_memory_hard_fault_active
        expr: label_del(increase(kubeneuron_gpu_ecc_errors_total{bits="double",scope="aggregate"}[1h]), "bits", "scope") > bool 0
        labels:
          component: uncorrectable_ecc_aggregate
      - record: kubeneuron_gpu_memory_hard_fault_active
        expr: label_del(increase(kubeneuron_gpu_remapped_rows_total{kind="uncorrectable"}[1h]), "kind") > bool 0
        labels:
          component: uncorrectable_row_remap
      - record: kubeneuron_gpu_memory_hard_fault_active
        expr: kubeneuron_gpu_row_remap_failed > bool 0
        labels:
          component: row_remap_failed
      - record: kubeneuron_gpu_memory_hard_fault_active
        expr: kubeneuron_gpu_row_remap_pending > bool 0
        labels:
          component: row_remap_pending
      - record: kubeneuron_gpu_memory_hard_fault_active
        expr: kubeneuron_gpu_retired_pages_pending > bool 0
        labels:
          component: retired_page_pending
      - record: kubeneuron_gpu_memory_hard_fault_active
        expr: kubeneuron_gpu_memory_unrepairable > bool 0
        labels:
          component: unrepairable

  # PCIe replay rate, link width/generation against their maxima, NVLink
  # error rates by type.
  - name: gpu-derived-links
    interval: 30s
    rules:
      - record: kubeneuron_gpu_pcie_replays_per_second
        expr: rate(kubeneuron_gpu_pcie_replays_total[5m])
      - record: kubeneuron_gpu_pcie_link_width_ratio
        expr: label_del(kubeneuron_gpu_pcie_link_width{kind="current"}, "kind") / (label_del(kubeneuron_gpu_pcie_link_width{kind="max"}, "kind") > 0)
      - record: kubeneuron_gpu_pcie_link_generation_ratio
        expr: label_del(kubeneuron_gpu_pcie_link_generation{kind="current"}, "kind") / (label_del(kubeneuron_gpu_pcie_link_generation{kind="max"}, "kind") > 0)
      # type flows through from the counter.
      - record: kubeneuron_gpu_nvlink_errors_per_second
        expr: rate(kubeneuron_gpu_nvlink_errors_total[5m])

  # Capacity returned to service, from the controller's resolved incidents.
  - name: gpu-derived-capacity
    interval: 30s
    rules:
      # class flows through from the counter.
      - record: kubeneuron_gpu_recovered_capacity_hours_total
        expr: label_del(kubeneuron_degraded_gpu_seconds_total{outcome="resolved"}, "outcome") / 3600

  # Experimental fail-slow shadow score (recording only; nothing consumes it).
  # Reads the derived clock and throttle ratios. Absent unless the device's SM
  # clock ratio is at least 15% below the median of its gpu_model peers, its
  # maximum throttle share over 5m is at least 0.05, and the gpu_model has at
  # least 3 distinct devices. Inputs are deduplicated to (node, gpu_uuid,
  # gpu_model) before the median and the count, so workload labels cannot
  # inflate the peer group. The value is the degradation score
  # 1 - own/peer_median, not a boolean.
  - name: gpu-derived-fail-slow
    interval: 30s
    rules:
      - record: kubeneuron_gpu_fail_slow_score_ratio
        expr: (1 - max by (node, gpu_uuid, gpu_model) (kubeneuron_gpu_clock_ratio{domain="sm"}) / on (gpu_model) group_left() (median by (gpu_model) (max by (node, gpu_uuid, gpu_model) (kubeneuron_gpu_clock_ratio{domain="sm"})) > 0)) >= 0.15 and on (node, gpu_uuid, gpu_model) (max by (node, gpu_uuid, gpu_model) (kubeneuron_gpu_throttle_share_ratio) >= 0.05) and on (gpu_model) (count by (gpu_model) (max by (node, gpu_uuid, gpu_model) (kubeneuron_gpu_clock_ratio{domain="sm"})) >= 3)
