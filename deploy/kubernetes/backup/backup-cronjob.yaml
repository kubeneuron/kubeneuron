# Scheduled online backups of the KubeNeuron SQLite workflow store.
#
# The controller serves GET /api/v1/backup behind the operator API token: a
# transactionally consistent VACUUM INTO snapshot streamed over HTTP. The
# distroless controller image needs no sqlite3/tar, and this Job needs no
# pods/exec RBAC — only the operator token Secret and network reach to the
# controller Service.
#
# Prerequisites:
#   - spec.notifications.operatorAPIToken set on the installation (the same
#     unowned Secret is referenced below).
#   - The installation name and namespace appear on the lines marked
#     "# <name>" and "# <ns>"; they default to the installer's defaults
#     (kubeneuron in kube-neuron). For another installation, change them
#     together, e.g. for install.sh --name fleet --namespace ops:
#       sed -e '/# <name>/s/kubeneuron/fleet/' -e '/# <ns>/s/kube-neuron/ops/' \
#         backup-cronjob.yaml | kubectl apply -f -
#   - With spec.tls.publicServerSecretRef set, switch SCHEME to https and
#     mount/trust the serving CA (see the commented lines).
#
# Restore procedure: docs/operations.md, "SQLite workflow store: backup and
# restore".
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kubeneuron-backups
  namespace: kube-neuron            # <ns>: the installation's namespace
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kubeneuron-backup
  namespace: kube-neuron            # <ns>
spec:
  schedule: "15 2 * * *"            # daily 02:15
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 900
      template:
        spec:
          restartPolicy: Never
          # Fits the Pod Security "restricted" profile. The user is the curl
          # image's own (curl_user), so copies an earlier version of this
          # template wrote stay readable and removable by the retention below.
          # fsGroup makes a freshly formatted volume (owned by root) writable
          # by that user; OnRootMismatch skips the ownership walk over the
          # copies once the volume root already matches.
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            fsGroup: 101
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: curlimages/curl:8.14.1   # pin a digest in production
              env:
                - name: INSTALLATION
                  value: kubeneuron           # <name>: your KubeNeuron object name
                - name: SCHEME
                  value: http                 # https with publicServerSecretRef
                - name: KEEP
                  value: "14"                 # dated copies to retain
                - name: OPERATOR_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: kubeneuron-operator-api-token  # <name>-operator-api-token
                      key: token
              command: ["/bin/sh", "-ceu"]
              args:
                - |
                  stamp=$(date -u +%Y%m%dT%H%M%SZ)
                  out="/backups/kubeneuron-$stamp.db"
                  echo "downloading snapshot -> $out"
                  curl --fail --silent --show-error --retry 3 \
                    -H "Authorization: Bearer $OPERATOR_TOKEN" \
                    "$SCHEME://$INSTALLATION-controller:8080/api/v1/backup" \
                    -o "$out"
                  # For https, add: --cacert /etc/kubeneuron-ca/ca.crt
                  test -s "$out"
                  ls -1t /backups/kubeneuron-*.db | tail -n +$((KEEP + 1)) | xargs -r rm -v
                  echo "retained:"; ls -lh /backups
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                # - name: public-ca            # https variant
                #   mountPath: /etc/kubeneuron-ca
                #   readOnly: true
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: kubeneuron-backups
            # - name: public-ca
            #   secret:
            #     secretName: kubeneuron-public-ca
