# KubeNeuron operator chart values.
#
# The chart deploys only the cluster-scoped CRDs and the operator. Creating
# a KubeNeuron installation (controller, agents, TLS Secrets, tokens) is a
# separate, deliberate step — see the production install guide.

image:
  repository: ghcr.io/kubeneuron/kubeneuron/operator
  # Pin an exact release tag or digest; the CRDs reject :latest for managed
  # workload images and the operator deserves the same discipline.
  tag: v0.8.0
  pullPolicy: IfNotPresent

replicas: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

serviceAccount:
  # Name of the operator ServiceAccount the chart creates.
  name: kubeneuron-operator

# Accelerator adapters the operator enables on the agents of every
# KubeNeuron installation, in addition to that installation's own
# spec.agent.adapters (an entry there replaces the one here for the same
# vendor). Each entry has the spec.agent.adapters shape: vendor, options, and
# optional hostTooling (binDirs, libDirs, devices). The adapter must be
# registered in the agent image. NVIDIA observation is on either way.
#
# A vendor enabled here starts on every accelerator node of a mixed fleet; on
# a node without that vendor's hardware the adapter reports "not present" and
# the agent skips it quietly.
#
# agentAdapters:
#   - vendor: amd
#     options:
#       tool: amd-smi
#     hostTooling:
#       binDirs: ["/opt/rocm/bin"]
#       libDirs: ["/opt/rocm/lib"]
#       devices: ["/dev/kfd"]
agentAdapters: []

nodeSelector: {}
tolerations: []
affinity: {}

# Extra labels merged into every chart-managed object.
additionalLabels: {}
