---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.17.3
  name: gpuplaybooks.kubeneuron.io
spec:
  group: kubeneuron.io
  names:
    kind: GPUPlaybook
    listKind: GPUPlaybookList
    plural: gpuplaybooks
    shortNames:
    - gplaybook
    singular: gpuplaybook
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: GPUPlaybook is a typed remediation playbook.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              GPUPlaybookSpec describes a typed, declarative remediation workflow.
              Reboot is the most destructive typed action; requiring its approval at
              admission mirrors the compiler's fail-closed rule.
            properties:
              cooldown:
                description: Cooldown is a Go duration (e.g. "6h").
                pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                type: string
              effects:
                items:
                  type: string
                type: array
              kubeNeuronRef:
                minLength: 1
                type: string
              onFailure:
                description: PlaybookFailure defines escalation after failure.
                properties:
                  playbookRef:
                    minLength: 1
                    type: string
                type: object
              steps:
                items:
                  description: PlaybookStep is one typed action in a remediation playbook.
                  properties:
                    action:
                      description: |-
                        PlaybookAction is deliberately closed. Arbitrary commands must never be
                        admitted through a configuration CRD.
                      enum:
                      - Observe
                      - Cordon
                      - Drain
                      - Uncordon
                      - EvictGPUWorkload
                      - IdleCheck
                      - WaitIdle
                      - GPUReset
                      - CollectBundle
                      - Reboot
                      - RunDiag
                      - VerifyGPUHealth
                      - VerifyNodeHealth
                      - OpenTicket
                      type: string
                    approval:
                      description: ApprovalRequirement controls whether a step requires
                        an operator decision.
                      enum:
                      - None
                      - Required
                      type: string
                    name:
                      minLength: 1
                      type: string
                    params:
                      additionalProperties:
                        type: string
                      type: object
                    timeout:
                      description: Timeout is a Go duration (e.g. "10m").
                      pattern: ^([0-9]+(\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$
                      type: string
                  required:
                  - action
                  - name
                  type: object
                minItems: 1
                type: array
              target:
                description: PlaybookTarget is the failure-domain target a playbook
                  addresses.
                enum:
                - GPU
                - Node
                type: string
            required:
            - kubeNeuronRef
            - steps
            - target
            type: object
            x-kubernetes-validations:
            - message: Reboot steps require approval Required
              rule: self.steps.all(s, s.action != 'Reboot' || (has(s.approval) &&
                s.approval == 'Required'))
          status:
            description: GPUPlaybookStatus records validation and its immutable effective
              digest.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              digest:
                type: string
              observedGeneration:
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
