name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "deploy/grafana/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "deploy/grafana/**"]
  # Lets release.yaml reuse this whole workflow as its gate: a tag must pass
  # exactly what every push passes before anything is signed or published.
  workflow_call:

permissions:
  contents: read

# A newer push supersedes the running build of the same ref; finishing the
# stale one only burns minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-and-test
            runner: ubuntu-latest
            arch: amd64
          - name: build-and-test-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kubeneuron
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
          cache: true

      - name: Verify generated code
        run: make verify-generate

      - name: Third-party licenses are current
        run: make verify-licenses

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Adapter contract modules (pkg/accelerator, pkg/cloud)
        # Each has its own go.mod, so the root ./... does not reach them. They
        # must stay standard-library only and tidy.
        run: |
          make verify-adapter-modules
          for m in pkg/accelerator pkg/cloud; do
            (
              cd "$m"
              go vet ./...
              go mod tidy -diff
              go test -race -count=1 ./...
            )
          done

      - name: Test (both store backends)
        env:
          KUBENEURON_TEST_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:5432/kubeneuron?sslmode=disable
        # -timeout 30m, not the default 10m per package. internal/controller
        # under -race takes minutes, and a hosted runner under load can cross
        # 600s and die with "test timed out" — an unexplained red that passes
        # on re-run, which is the most expensive kind of CI failure there is.
        run: go test -race -count=1 -timeout 30m ./...

  kind-integration:
    # Hosted runners: free and unlimited on public repositories.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: kind-integration
            runner: ubuntu-24.04
            arch: amd64
            suite: main
            kind_sha256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
            kubectl_sha256: fe80ae4133b44fa2077db4af144e80765eb1b3b2eede55fbff6933c4374d8c6e
          - name: kind-integration-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
            suite: main
            kind_sha256: b92cd615e97585de8ddade28ed5cd7feb4248d717c233eea5b03c37298900f5d
            kubectl_sha256: d1a1f7b86859108406e997430a59c95c72a77cc33cdc4faccd046407aff2cfac
          # The installer's lifecycle and the Managed metrics path, beside
          # the rest on its own runner. amd64 only: the images are the same
          # build per arch, and arm64 runs the main suite.
          - name: kind-integration-installer
            runner: ubuntu-24.04
            arch: amd64
            suite: installer
            kind_sha256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
            kubectl_sha256: fe80ae4133b44fa2077db4af144e80765eb1b3b2eede55fbff6933c4374d8c6e
          # The agent's journal mount on two workers, upgraded from main.
          - name: kind-journal
            runner: ubuntu-24.04
            arch: amd64
            suite: main
            target: test-journal-kind
            kind_sha256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
            kubectl_sha256: fe80ae4133b44fa2077db4af144e80765eb1b3b2eede55fbff6933c4374d8c6e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    # Checksums: kind release kind-linux-<arch>.sha256sum and
    # dl.k8s.io/release/<version>/bin/linux/<arch>/kubectl.sha256.
    env:
      KIND_VERSION: v0.32.0
      KIND_SHA256: ${{ matrix.kind_sha256 }}
      KUBECTL_VERSION: v1.33.12
      KUBECTL_SHA256: ${{ matrix.kubectl_sha256 }}
      TOOL_ARCH: ${{ matrix.arch }}
      KIND_CLUSTER_NAME: kubeneuron-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner context is not available in job-level env — an expression
      # there invalidates the whole workflow file ("No jobs were run").
      - name: Set temp paths
        run: |
          echo "KIND_KUBECONFIG=$RUNNER_TEMP/kubeneuron-ci.kubeconfig" >> "$GITHUB_ENV"
          echo "KIND_ARTIFACTS_DIR=$RUNNER_TEMP/kubeneuron-kind-artifacts" >> "$GITHUB_ENV"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
          cache: true

      - name: Install pinned Kubernetes clients
        shell: bash
        run: |
          set -euo pipefail
          case "$TOOL_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "runner architecture does not match $TOOL_ARCH" >&2; exit 1 ;;
          esac
          tools="$RUNNER_TEMP/kubeneuron-tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 \
            --output "$tools/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${TOOL_ARCH}"
          printf '%s  %s\n' "$KIND_SHA256" "$tools/kind" | sha256sum --check -
          curl --fail --location --retry 3 \
            --output "$tools/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${TOOL_ARCH}/kubectl"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$tools/kubectl" | sha256sum --check -
          chmod 0755 "$tools/kind" "$tools/kubectl"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Raise inotify limits for the multi-node cluster
        run: |
          sudo sysctl fs.inotify.max_user_instances=512 \
            fs.inotify.max_user_watches=524288

      - name: Verify tooling and Docker
        shell: bash
        run: |
          set -euo pipefail
          kind version
          kubectl version --client=true -o yaml
          timeout 30s bash -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
          docker version
          docker info --format 'driver={{.Driver}} cgroup={{.CgroupVersion}} os={{.OperatingSystem}}'

      - name: Run pinned kind integration
        env:
          KEEP_CLUSTER: "1"
          KEEP_RESOURCES: "1"
          INTEGRATION_SUITE: ${{ matrix.suite }}
        run: make ${{ matrix.target || 'test-integration-kind' }}

      - name: Collect kind diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$KIND_ARTIFACTS_DIR"
          kind version >"$KIND_ARTIFACTS_DIR/kind-version.txt" 2>&1
          docker version >"$KIND_ARTIFACTS_DIR/docker-version.txt" 2>&1
          if kind get clusters 2>/dev/null | grep -Fxq "$KIND_CLUSTER_NAME"; then
            export KUBECONFIG="$KIND_KUBECONFIG"
            kubectl version -o yaml >"$KIND_ARTIFACTS_DIR/kubernetes-version.yaml" 2>&1
            kubectl get nodes,storageclasses -o wide >"$KIND_ARTIFACTS_DIR/cluster.txt" 2>&1
            kubectl get crds >"$KIND_ARTIFACTS_DIR/crds.txt" 2>&1
            kubectl get kubeneurons.kubeneuron.io -o yaml >"$KIND_ARTIFACTS_DIR/roots.yaml" 2>&1
            kubectl get all,pvc,configmap,serviceaccount,poddisruptionbudget \
              --all-namespaces -o wide >"$KIND_ARTIFACTS_DIR/resources.txt" 2>&1
            kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp \
              >"$KIND_ARTIFACTS_DIR/events.txt" 2>&1
            kubectl -n kube-neuron logs deployment/kubeneuron-operator \
              --all-containers --tail=-1 >"$KIND_ARTIFACTS_DIR/operator.log" 2>&1
            kubectl -n kubeneuron-integration-smoke logs \
              deployment/integration-smoke-controller --all-containers --tail=-1 \
              >"$KIND_ARTIFACTS_DIR/controller.log" 2>&1
            kubectl -n kubeneuron-integration-smoke logs \
              daemonset/integration-smoke-agent --all-containers --tail=-1 \
              >"$KIND_ARTIFACTS_DIR/agent.log" 2>&1
            node="$(kind get nodes --name "$KIND_CLUSTER_NAME" | head -n1)"
            docker inspect "$node" --format '{{json .Config.Image}}' \
              >"$KIND_ARTIFACTS_DIR/node-image.txt" 2>&1
            docker logs "$node" >"$KIND_ARTIFACTS_DIR/kind-node.log" 2>&1
          fi

      - name: Delete kind cluster
        if: always()
        run: make kind-clean || true

      - name: Upload kind diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.name }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KIND_ARTIFACTS_DIR }}
          if-no-files-found: warn
          retention-days: 7

  kind-replacement:
    name: kind-replacement (${{ matrix.provider }})
    strategy:
      fail-fast: false
      matrix:
        provider: [aws, gke, aks]
        include:
          - name: kind-replacement
            runner: ubuntu-24.04
            arch: amd64
            suite: main
            target: test-replacement-kind
            kind_sha256: 50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54
            kubectl_sha256: fe80ae4133b44fa2077db4af144e80765eb1b3b2eede55fbff6933c4374d8c6e
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      KIND_VERSION: v0.32.0
      KIND_SHA256: ${{ matrix.kind_sha256 }}
      KUBECTL_VERSION: v1.33.12
      KUBECTL_SHA256: ${{ matrix.kubectl_sha256 }}
      TOOL_ARCH: ${{ matrix.arch }}
      KIND_CLUSTER_NAME: kubeneuron-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The runner context is not available in job-level env — an expression
      # there invalidates the whole workflow file ("No jobs were run").
      - name: Set temp paths
        run: |
          echo "KIND_KUBECONFIG=$RUNNER_TEMP/kubeneuron-ci.kubeconfig" >> "$GITHUB_ENV"
          echo "KIND_ARTIFACTS_DIR=$RUNNER_TEMP/kubeneuron-kind-artifacts" >> "$GITHUB_ENV"

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
          cache: true

      - name: Install pinned Kubernetes clients
        shell: bash
        run: |
          set -euo pipefail
          case "$TOOL_ARCH:$(uname -m)" in
            amd64:x86_64|arm64:aarch64) ;;
            *) echo "runner architecture does not match $TOOL_ARCH" >&2; exit 1 ;;
          esac
          tools="$RUNNER_TEMP/kubeneuron-tools"
          mkdir -p "$tools"
          curl --fail --location --retry 3 \
            --output "$tools/kind" \
            "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${TOOL_ARCH}"
          printf '%s  %s\n' "$KIND_SHA256" "$tools/kind" | sha256sum --check -
          curl --fail --location --retry 3 \
            --output "$tools/kubectl" \
            "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/${TOOL_ARCH}/kubectl"
          printf '%s  %s\n' "$KUBECTL_SHA256" "$tools/kubectl" | sha256sum --check -
          chmod 0755 "$tools/kind" "$tools/kubectl"
          echo "$tools" >> "$GITHUB_PATH"

      - name: Raise inotify limits for the multi-node cluster
        run: |
          sudo sysctl fs.inotify.max_user_instances=512 \
            fs.inotify.max_user_watches=524288

      - name: Verify tooling and Docker
        shell: bash
        run: |
          set -euo pipefail
          kind version
          kubectl version --client=true -o yaml
          timeout 30s bash -c 'until docker info >/dev/null 2>&1; do sleep 2; done'
          docker version
          docker info --format 'driver={{.Driver}} cgroup={{.CgroupVersion}} os={{.OperatingSystem}}'

      - name: Run pinned kind integration
        env:
          KEEP_CLUSTER: "1"
          KEEP_RESOURCES: "1"
          REPLACEMENT_PROVIDER: ${{ matrix.provider }}
          INTEGRATION_SUITE: ${{ matrix.suite }}
        run: make ${{ matrix.target || 'test-integration-kind' }}

      - name: Collect kind diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          mkdir -p "$KIND_ARTIFACTS_DIR"
          kind version >"$KIND_ARTIFACTS_DIR/kind-version.txt" 2>&1
          docker version >"$KIND_ARTIFACTS_DIR/docker-version.txt" 2>&1
          if kind get clusters 2>/dev/null | grep -Fxq "$KIND_CLUSTER_NAME"; then
            export KUBECONFIG="$KIND_KUBECONFIG"
            kubectl version -o yaml >"$KIND_ARTIFACTS_DIR/kubernetes-version.yaml" 2>&1
            kubectl get nodes,storageclasses -o wide >"$KIND_ARTIFACTS_DIR/cluster.txt" 2>&1
            kubectl get crds >"$KIND_ARTIFACTS_DIR/crds.txt" 2>&1
            kubectl get kubeneurons.kubeneuron.io -o yaml >"$KIND_ARTIFACTS_DIR/roots.yaml" 2>&1
            kubectl get all,pvc,configmap,serviceaccount,poddisruptionbudget \
              --all-namespaces -o wide >"$KIND_ARTIFACTS_DIR/resources.txt" 2>&1
            kubectl get events --all-namespaces --sort-by=.metadata.creationTimestamp \
              >"$KIND_ARTIFACTS_DIR/events.txt" 2>&1
            kubectl -n kube-neuron logs deployment/kubeneuron-operator \
              --all-containers --tail=-1 >"$KIND_ARTIFACTS_DIR/operator.log" 2>&1
            kubectl -n kubeneuron-integration-smoke logs \
              deployment/integration-smoke-controller --all-containers --tail=-1 \
              >"$KIND_ARTIFACTS_DIR/controller.log" 2>&1
            kubectl -n kubeneuron-integration-smoke logs \
              daemonset/integration-smoke-agent --all-containers --tail=-1 \
              >"$KIND_ARTIFACTS_DIR/agent.log" 2>&1
            node="$(kind get nodes --name "$KIND_CLUSTER_NAME" | head -n1)"
            docker inspect "$node" --format '{{json .Config.Image}}' \
              >"$KIND_ARTIFACTS_DIR/node-image.txt" 2>&1
            docker logs "$node" >"$KIND_ARTIFACTS_DIR/kind-node.log" 2>&1
          fi

      - name: Delete kind cluster
        if: always()
        run: make kind-clean || true

      - name: Upload kind diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.provider }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.KIND_ARTIFACTS_DIR }}
          if-no-files-found: warn
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0

      - name: golangci-lint (pkg/accelerator module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: pkg/accelerator
          args: --config ${{ github.workspace }}/.golangci.yml

      - name: golangci-lint (pkg/cloud module)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: pkg/cloud
          args: --config ${{ github.workspace }}/.golangci.yml

      - name: SPDX headers match LICENSE
        run: python3 -I hack/verify-spdx.py

      - name: shellcheck (pinned, same version as local make lint)
        # The runner's preinstalled shellcheck is older than the one developers
        # run, so a warning it does not know (SC2329) passed CI and failed
        # locally. Pinned by version and checksum; actionlint below finds this
        # binary on PATH too. Versions: docs/release-checklist.md.
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --retry-delay 5 --connect-timeout 20 --max-time 300 -fsSLo /tmp/shellcheck.tar.xz \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install -m 0755 "/tmp/shellcheck-${SHELLCHECK_VERSION}/shellcheck" /usr/local/bin/shellcheck
          shellcheck --version
          shellcheck hack/*.sh deploy/install.sh

      - name: Inputs pinned (actions by commit SHA, images by digest)
        run: bash hack/verify-pins.sh

      - name: Compare installer cloud pack with the shipped manifests
        run: make test-cloud-pack-render

      - name: Install manifest keeps each object's namespace
        run: make test-install-manifest-namespaces

      - name: Installer explains a repository with no stable release
        run: make test-install-latest

      - name: DCO check accepts a signed-off root commit
        run: make test-verify-dco

      - name: Alert rule unit tests (vmalert-tool, pinned by digest)
        run: make test-alert-rules

      - name: Rules and dashboards are plain PromQL (promtool and vmalert, pinned by digest)
        run: make check-rules

      - name: actionlint (workflow files stay valid)
        # From the module's own tool dependency, not @version: the fetch form
        # reaches the network on every run, so a proxy hiccup fails the lint
        # job for a reason that has nothing to do with the change under test.
        run: go tool actionlint

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "1.26.11"
          cache: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  image:
    # The only job that builds what is actually published. Everything else
    # tests the code; this tests the artifact — that the distroless image
    # starts, that the agent still carries the host tools it shells out to,
    # and that the BuildKit path `make docker` uses has not broken.
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: image
            runner: ubuntu-latest
            arch: amd64
          - name: image-arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the compiler stage is native
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker build --target build -t kubeneuron-build-check:ci -f build/Dockerfile .
          actual=$(docker run --rm kubeneuron-build-check:ci go env GOHOSTARCH)
          test "$actual" = "$EXPECTED_ARCH"
          docker run --rm kubeneuron-build-check:ci uname -m

      - name: Verify the published image
        env:
          DOCKER_DEFAULT_PLATFORM: linux/${{ matrix.arch }}
        run: bash hack/verify-image.sh ci

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build docs (strict)
        run: |
          pip install "mkdocs-material==9.*"
          mkdocs build --strict

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint and template the chart
        run: |
          helm lint deploy/helm/kubeneuron
          helm template kubeneuron deploy/helm/kubeneuron \
            --namespace kube-neuron > /tmp/helm-out.yaml

      - name: Chart must match the kustomize manifests
        shell: python
        run: |
          import yaml
          helm_docs = list(yaml.safe_load_all(open('/tmp/helm-out.yaml')))
          helm_cr = next(d for d in helm_docs if d and d.get('kind') == 'ClusterRole')
          kust_cr = yaml.safe_load(open('config/rbac/operator_role.yaml'))
          assert helm_cr['rules'] == kust_cr['rules'], 'ClusterRole rules diverge'
          helm_dep = next(d for d in helm_docs if d and d.get('kind') == 'Deployment')
          kust_dep = yaml.safe_load(open('config/default/operator_deployment.yaml'))
          hc = helm_dep['spec']['template']['spec']['containers'][0]
          kc = kust_dep['spec']['template']['spec']['containers'][0]
          assert hc['args'] == kc['args'] and hc['image'] == kc['image'], 'Deployment diverges'
          print('chart matches kustomize manifests')

      - name: Chart enables node-level actions only on opt-in
        shell: python
        run: |
          import subprocess, yaml
          flag = '--allow-node-level-actions'
          for overrides, expected in [([], []), (['--set', 'operator.allowNodeLevelActions=true'], [flag + '=true'])]:
              rendered = subprocess.check_output(['helm', 'template', 'kubeneuron', 'deploy/helm/kubeneuron', *overrides])
              deployment = next(d for d in yaml.safe_load_all(rendered) if d and d['kind'] == 'Deployment')
              args = deployment['spec']['template']['spec']['containers'][0]['args']
              assert [arg for arg in args if arg.split('=')[0] == flag] == expected, args

      - name: Chart passes agentAdapters to the operator
        shell: python
        run: |
          import json, subprocess, yaml
          adapters = [{"vendor": "amd", "options": {"tool": "amd-smi: v2", "q": "it's"},
                       "hostTooling": {"binDirs": ["/opt/rocm/bin"], "devices": ["/dev/kfd"]}}]
          out = subprocess.run(
              ['helm', 'template', 'kubeneuron', 'deploy/helm/kubeneuron', '--namespace', 'kube-neuron',
               '--set-json', 'agentAdapters=' + json.dumps(adapters)],
              check=True, capture_output=True, text=True).stdout
          dep = next(d for d in yaml.safe_load_all(out) if d and d.get('kind') == 'Deployment')
          args = dep['spec']['template']['spec']['containers'][0]['args']
          flag = '--default-agent-adapters='
          values = [a[len(flag):] for a in args if a.startswith(flag)]
          assert len(values) == 1, args
          assert json.loads(values[0]) == adapters, values[0]
          print('chart renders agentAdapters as --default-agent-adapters')
