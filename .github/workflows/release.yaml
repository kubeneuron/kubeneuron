name: Release

# Tag-driven release: gated on the full CI (build/vet/tests on both store
# backends + the kind integration suite), then multi-arch images to GHCR
# (cosign-keyless-signed, with SBOMs), a DIGEST-pinned single-file install
# manifest, kubeneuronctl binaries, and one checksums file — assembled into a
# published (non-draft) GitHub release whose notes carry the digest table.
#
# A tag on a broken tree must ship nothing: every publishing job `needs` the
# gates. Nothing here uses a stored secret — GHCR auth is GITHUB_TOKEN and
# cosign signing is keyless via the job's OIDC identity token.
on:
  push:
    tags: ["v*"]

# Default-deny; each job asks for exactly what it publishes with.
permissions: {}

env:
  # MUST match what every consumer looks at (config/default, the Helm
  # chart, deploy/install.sh, docs): ghcr.io/<owner>/kubeneuron/<image>.
  # The legacy hyphenated namespace shipped v0.1.x and is frozen; publishing
  # there would put images where no manifest or chart ever looks.
  IMAGE_REPO: ghcr.io/${{ github.repository_owner }}/kubeneuron
  KUSTOMIZE_VERSION: v5.6.0

jobs:
  # The gate IS the CI workflow — identical checks, zero drift.
  gates:
    if: github.repository == 'kubeneuron/kubeneuron'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  images:
    if: github.repository == 'kubeneuron/kubeneuron'
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      digests: ${{ steps.build.outputs.digests }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: sigstore/cosign-installer@v3

      - uses: anchore/sbom-action/download-syft@v0
        id: syft

      - name: Build, push, sign, and SBOM the images
        id: build
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          digests="{"
          # published image name -> Dockerfile stage
          for entry in operator=operator controller=controller agent=agent kubeneuronctl=cli; do
            name="${entry%%=*}"
            stage="${entry#*=}"
            image="${IMAGE_REPO}/${name}"
            docker buildx build \
              --file build/Dockerfile \
              --platform linux/amd64,linux/arm64 \
              --target "$stage" \
              --build-arg VERSION="$version" \
              --tag "$image:$version" \
              --push .
            digest="$(docker buildx imagetools inspect "$image:$version" \
              --format '{{json .Manifest}}' | jq -r .digest)"
            test -n "$digest" && [[ "$digest" == sha256:* ]]
            cosign sign --yes "$image@$digest"
            "${{ steps.syft.outputs.cmd }}" "$image:$version" \
              -o spdx-json > "dist/sbom-${name}-${version}.spdx.json"
            echo "${image}@${digest}" >> dist/images.txt
            digests="${digests}\"${name}\":\"${digest}\","
          done
          digests="${digests%,}}"
          echo "digests=${digests}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: images-dist
          path: dist/
          retention-days: 1

  manifest:
    if: github.repository == 'kubeneuron/kubeneuron'
    needs: [images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - name: Build DIGEST-pinned single-file install manifest
        shell: bash
        env:
          DIGESTS: ${{ needs.images.outputs.digests }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          operator_digest="$(jq -r .operator <<<"$DIGESTS")"
          [[ "$operator_digest" == sha256:* ]]
          workdir="$(mktemp -d)"
          cp -r config "$workdir/config"
          (
            cd "$workdir/config/default"
            # Pin by digest, not tag: a re-pushed tag can never change what
            # an already-downloaded manifest installs.
            go run "sigs.k8s.io/kustomize/kustomize/v5@${KUSTOMIZE_VERSION}" \
              edit set image \
              "${IMAGE_REPO}/operator=${IMAGE_REPO}/operator@${operator_digest}"
          )
          go run "sigs.k8s.io/kustomize/kustomize/v5@${KUSTOMIZE_VERSION}" \
            build "$workdir/config/default" > "dist/kubeneuron-install-${version}.yaml"
          grep -q "image: ${IMAGE_REPO}/operator@${operator_digest}" \
            "dist/kubeneuron-install-${version}.yaml"
          # The manifest must not smuggle any tag-pinned image reference.
          # Any tag-shaped reference (:v1.2.3, :1.2.3, :latest) is a leak;
          # only digest pins may survive.
          if grep -E "image: [^@[:space:]]+:[^@[:space:]]+$" "dist/kubeneuron-install-${version}.yaml"; then
            echo "tag-pinned image reference in the install manifest" >&2
            exit 1
          fi
          cp deploy/install.sh "dist/install-${version}.sh"
          cp deploy/install.sh dist/install.sh

      - uses: actions/upload-artifact@v4
        with:
          name: manifest-dist
          path: dist/
          retention-days: 1

  ctl:
    if: github.repository == 'kubeneuron/kubeneuron'
    needs: [gates]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.12"
          cache: true

      - name: Build kubeneuronctl binaries
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          for platform in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${platform%%/*}"; goarch="${platform#*/}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" \
              go build -trimpath -ldflags "-s -w -X main.version=${version}" \
              -o "dist/kubeneuronctl-${version}-${goos}-${goarch}" ./cmd/kubeneuronctl
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ctl-dist
          path: dist/
          retention-days: 1

  release:
    if: github.repository == 'kubeneuron/kubeneuron'
    needs: [images, manifest, ctl]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write # cosign sign-blob of the checksums file
    steps:
      - uses: actions/download-artifact@v4
        with:
          # ONLY this workflow's own build artifacts. Without the pattern
          # this pulls every artifact in the run — including the kind gate's
          # diagnostic dump (controller/agent logs, cluster resources) — and
          # ships it as release assets. The rc-1 run proved it.
          pattern: "*-dist"
          path: collected

      - uses: sigstore/cosign-installer@v3

      - name: Assemble dist, checksums, and digest table
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          mkdir -p dist
          cp collected/*/* dist/
          # Fail loudly rather than ship a surprise: the release carries
          # exactly the four artifact kinds below.
          for f in dist/*; do
            case "$(basename "$f")" in
              kubeneuronctl-*|sbom-*|images.txt|install.sh|install-*.sh|kubeneuron-install-*.yaml) ;;
              *) echo "unexpected release asset: $f" >&2; exit 1 ;;
            esac
          done
          (
            cd dist
            sha256sum -- * > "checksums-${version}.txt"
            cosign sign-blob --yes \
              --output-signature "checksums-${version}.txt.sig" \
              --output-certificate "checksums-${version}.txt.pem" \
              "checksums-${version}.txt"
          )
          {
            echo "## Images (multi-arch, cosign-signed, digest-pinned)"
            echo
            echo '```'
            cat dist/images.txt
            echo '```'
            echo
            echo "Install manifest and installer pin these digests; verify any"
            echo "image with \`cosign verify\` against the GitHub OIDC issuer."
            echo
            echo "Store migration heads: sqlite 0018 / postgres 0009. A park"
            echo "pending across the upgrade needs one re-approval."
          } > notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          # A tag containing '-' is a prerelease (v0.2.2-rc.1): it must never
          # become releases/latest, which is what install.md's advertised
          # one-liner downloads.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body_path: notes.md
          files: dist/*
