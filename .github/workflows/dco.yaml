# SPDX-License-Identifier: Apache-2.0
name: DCO

# Every commit of a pull request carries its author's Signed-off-by
# (Developer Certificate of Origin, decided m994). A separate workflow on
# purpose: ci.yaml skips documentation-only changes, and a documentation
# contribution is a contribution under the project's licence too.
on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Every commit is signed off by its author
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash hack/verify-dco.sh "$BASE_SHA" "$HEAD_SHA"
